<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Tap Rush</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0b1020;color:white;min-height:100vh;display:flex;justify-content:center}
.game{width:min(100%,520px);padding:22px 16px;text-align:center}
h1{margin:8px 0 4px;font-size:34px}.sub{opacity:.7;margin-bottom:18px}
.stats{display:flex;gap:10px;justify-content:center;margin-bottom:18px}.card{background:#151d33;border:1px solid #293552;border-radius:14px;padding:10px 18px;min-width:105px}.num{font-size:25px;font-weight:800}
.arena{height:430px;border-radius:24px;background:radial-gradient(circle at center,#1d2a4b,#0e1427);border:2px solid #293552;position:relative;overflow:hidden}
.target{position:absolute;width:74px;height:74px;border-radius:50%;border:0;background:#fbbf24;box-shadow:0 0 28px #f59e0b;cursor:pointer;display:none;transform:translate(-50%,-50%);font-size:25px}
button.start{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:#6366f1;color:#fff;font-size:18px;font-weight:700}
.message{margin-top:12px;min-height:25px;opacity:.85}
</style>
</head>
<body>
<main class="game">
<h1>⚡ Tap Rush</h1><div class="sub">Tap the target as fast as you can!</div>
<div class="stats"><div class="card">Score<div class="num" id="score">0</div></div><div class="card">Time<div class="num" id="time">30</div></div><div class="card">Best<div class="num" id="best">0</div></div></div>
<div class="arena" id="arena"><button class="target" id="target" aria-label="Tap target">⚡</button></div>
<button class="start" id="start">Start Game</button>
<div class="message" id="message">30 seconds. How high can you score?</div>
</main>
<script>
const arena=document.getElementById('arena'),target=document.getElementById('target'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),start=document.getElementById('start'),msg=document.getElementById('message');
let score=0,time=30,timer=null,running=false,best=Number(localStorage.getItem('tapRushBest')||0); bestEl.textContent=best;
function move(){const r=arena.getBoundingClientRect(),pad=45;target.style.left=(pad+Math.random()*(r.width-pad*2))+'px';target.style.top=(pad+Math.random()*(r.height-pad*2))+'px';target.style.display='block'}
target.addEventListener('click',()=>{if(!running)return;score++;scoreEl.textContent=score;move()});
function end(){running=false;clearInterval(timer);target.style.display='none';start.textContent='Play Again';if(score>best){best=score;localStorage.setItem('tapRushBest',best);bestEl.textContent=best;msg.textContent='🏆 New best score: '+score+'!'}else msg.textContent='Game over! Score: '+score;}
start.addEventListener('click',()=>{clearInterval(timer);score=0;time=30;running=true;scoreEl.textContent=0;timeEl.textContent=30;msg.textContent='Go!';start.textContent='Restart';move();timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)end()},1000)});
</script>
</body></html>
